name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Lint, types and full tests (Windows)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov --cov-report=term
      - name: Scan the runner's real shortcuts (read-only smoke test)
        run: uv run python -m app.cli scan --dump-dir scan-dump
      - name: Coverage gate for the engine and backup manifest
        run: uv run coverage report --include="engine/*,platform_win/backup.py" --fail-under=90

  engine-linux:
    name: Portable tests (Ubuntu, proves engine/ is OS-free)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      # pytest-qt loads Qt at startup, which needs these system libraries.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not windows"
