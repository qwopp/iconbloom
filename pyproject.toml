[project]
name = "iconbloom"
version = "0.6.0"
description = "Restyle Windows shortcut icons into a cute, cohesive theme."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "icoextract>=0.3.1",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyside6-essentials>=6.12.0",
    "pywin32>=312 ; sys_platform == 'win32'",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-qt>=4.5.0",
    "resvg-py>=0.5.0",
    "ruff>=0.17.4",
    "types-pywin32>=312.0.0.20261104",
]
release = [
    "pyinstaller>=6.22.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "BLE", "N",
    "PLE", "PLW", "PLC", "RET", "PIE", "PT", "TID", "ARG",
]
ignore = [
    "PLW2901",  # rebinding a loop variable is often the clearest way to normalize input
]

[tool.ruff.lint.per-file-ignores]
# pywin32 is imported inside functions so these modules still load on Linux.
"platform_win/*" = ["PLC0415"]
"tests/win/*" = ["PLC0415"]
# Fakes and monkeypatched stand-ins must match real signatures they ignore.
"tests/*" = ["ARG"]
# ItemIO implementations keep the protocol's parameters even when one kind ignores them.
"platform_win/item_io.py" = ["ARG002"]
"platform_win/shell_icons.py" = ["ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
include = ["."]
exclude = [".venv", "build", "dist"]
pythonVersion = "3.12"
pythonPlatform = "Windows"
typeCheckingMode = "basic"
strict = ["engine"]
# pywin32 only installs on Windows; its stubs are enough to type-check elsewhere.
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "windows: needs a real Windows shell (IShellLink, known folders)",
]

[tool.coverage.run]
branch = true
source = ["engine", "platform_win", "app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
